  - { area: "external_consumers", reason: "Không có metadata graph tập trung nên không thấy hệ thống ngoài repo. Một repo một System, chưa công bố contract cho bên ngoài, nên danh sách rỗng là kết quả đúng ở phạm vi này chứ không phải chưa tính." }
  - { area: "architecture-and-contracts", reason: "Chưa có artifact L1/L2/L3 nào (architecture/, tech-specs/ trống). Thiết kế nằm sau Scope Gate nên không có gì để tính stale." }
  - { area: "code-traceability", reason: "grep src/ và tests/ cho 0 kết quả với mọi mã FR/AC/NFR. Code chưa gắn traceability nên không suy được thay đổi yêu cầu chạm file code nào." }
  - { area: "missing-requirements", reason: "Script chỉ thấy artifact đang tồn tại; yêu cầu bị bỏ sót hoàn toàn thì không có node để phát hiện. Hai chỗ hở đã tìm được (entry point, thư viện bên ngoài) là do đọc đề bài mục 3.6 bằng mắt, không do script. Việc rà đủ vẫn thuộc về người." }

