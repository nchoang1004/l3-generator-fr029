attachments_verbatim:
  - "A. [FR-029 — Tài liệu L3 API và cấu trúc component (line 107)](D:/VSF/l3-generator-l3/.aide/requirements/fr/FR-L3GEN-029.md:107) có 8 yêu cầu nghiệm thu:\n1. Sinh tài liệu API: method, path đầy đủ, handler và bằng chứng.\n2. Ghi tham số, request/response model, kiểu, required, nullable, status.\n3. Ghi rõ trường chưa biết hoặc suy ra từ mặc định.\n4. Đối chiếu API với dữ liệu kiến trúc.\n5. Loại route test; báo giới hạn với route không khai bằng decorator.\n6. Sinh README: mục lục, cấu trúc, HTTP ra ngoài, contract chưa gán và giới hạn.\n7. Liệt kê package/module và vai trò từng file.\n8. Ghi các lời gọi HTTP ra ngoài cùng bằng chứng.\nđây"
