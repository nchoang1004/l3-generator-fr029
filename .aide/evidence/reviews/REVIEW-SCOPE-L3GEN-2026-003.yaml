findings:
  - { id: R1, severity: medium, route: bad_spec, location: "FR-028 bảng 'Component là gì' dòng Dùng chung và bảng 'Ai quyết phần nào'; NFR-AI-002 'Việc của model', 'Kiểm câu trả lời'; glossary 'Tên dùng chung'; AC-028-03, AC-028-05", summary: "Chưa có luật xếp file dùng chung. (1) 'Tách theo việc: hạ tầng theo loại kết nối, dữ liệu dùng chung, tiện ích dùng chung' không nói dấu hiệu nào quyết loại nào; bảng 'Ai quyết' không ghi việc này do code hay model. (2) FR-028 cho model chọn 'file dùng chung', AI-002 và glossary cho model chọn 'tên dùng chung'. Hai tên trong cùng một file được gán cho hai component thì file vào đâu, không có luật; AC-028-05 cũng không loại trường hợp này. Hệ quả: AC-028-03 không có đáp án xác định cho file dùng chung kiểu crud.py, models.py, kéo theo chủ của bảng (AC-030-05)." }
  - { id: R2, severity: low, route: patch, location: "CSV-CHG-L3GEN-2026-002-r7 mục 2", summary: "Mục 2 ghi 'Ánh xạ cũ sang mới ở PRD', nhưng PRD revision 30 chỉ có ánh xạ FR (IV.3), không có ánh xạ GOAL/KPI. Mục 2 cũng không hiện KPI-006 đến 010, dù revision 30 đổi KPI-006, 008, 009. D.1b yêu cầu mục này hiện diff GOAL/KPI; người duyệt đọc CSV không thấy KPI." }
  - { id: R3, severity: low, route: patch, location: "PRD II.4 KPI-007 cột Target; PRD VI 'Chất lượng kết luận'; PRD VIII 'Điều kiện chuyển mốc'", summary: "PRD VI và VIII ghi 'KPI-L3GEN-007 đạt 100%', không có mức một phần. Nhưng KPI-007 gồm phần (b) mã dòng model trỏ hợp lệ, ngưỡng ≥ 90% ở NFR-ACC-002. Đọc đúng chữ thì M3 đòi phần (b) đạt 100%. Con số 100% còn chép ở ba chỗ trong PRD, trái câu 'PRD không giữ bản sao công thức hoặc ngưỡng' ở II.4." }
  - { id: R4, severity: low, route: bad_spec, location: "NFR-ABST-002 gạch 'Khi vượt 50 node'; FR-029 'Chia theo component'; PRD V.2 dòng 'Nhiều component hơn trần số node' ↔ FR-029 'Đầu ra'; PRD IV.1 'Xuất kết quả'", summary: "ABST-002, FR-029 và PRD V.2 ghi component bị cắt khỏi sơ đồ 'vẫn có thư mục tech-specs/', không điều kiện. FR-029 'Đầu ra' và PRD IV.1 ghi chỉ component sở hữu ít nhất một contract mới có thư mục. Luật cắt xếp theo số contract và số mũi tên, nên component bị cắt dễ là component không có contract; hai câu cho hai kết quả khác nhau." }
  - { id: R5, severity: low, route: patch, location: "NFR-SEC-002 'Dữ liệu gửi ra ngoài' và 'Điều kiện và cách kiểm' ↔ NFR-AI-002 'Đầu vào gửi cho model'", summary: "SEC-002 nói dữ liệu gửi đi theo mục 'Đầu vào gửi cho model' của AI-002 rồi tự liệt kê lại, và hai danh sách lệch. SEC-002 có đường dẫn file, tên hàm và lớp cấp cao nhất. AI-002 có hệ thống ngoài mỗi route chạm và số lời gọi giữa các nhóm. Đây là danh sách báo người dùng trước khi gửi. Việc báo trước khi chạy cũng không có AC và không có trong cách kiểm của SEC-002." }
  - { id: R6, severity: low, route: intent_gap, location: "AC-029-01 Given; AC-028-09 Given; glossary mục 7", summary: "Route khai ngoài decorator, ví dụ `add_api_route` (glossary mục 7 nêu tên), không được đọc và không có trong danh sách phải báo ở phần giới hạn. FR-030, FR-031 và mục HTTP của FR-029 đều có luật 'ghi ở phần giới hạn' cho cách khai ngoài phạm vi; route thì không. Route loại này bị bỏ sót im lặng, trái bất biến #4 của glossary và ý của KPI-010." }
  - { id: R7, severity: low, route: bad_spec, location: "FR-028 bảng 'Mũi tên nào được vẽ' dòng 'Gửi tác vụ nền'; FR-028 'Phạm vi đọc'; FR-031 'Phạm vi đọc'", summary: "FR-028 (Must, M1) vẽ mũi tên gửi tác vụ nền, nhưng 'Phạm vi đọc' của FR-028 không nêu dạng gửi và nhận nào được nhận. Các dạng này (.delay, add_task...) chỉ có ở FR-031 (Should, M3). Ở M1, hoặc khi FR-031 bị cắt, AC-028-06 không có phạm vi để kiểm dòng 'Gửi tác vụ nền'." }
  - { id: R8, severity: low, route: intent_gap, location: "AC-028-02; FR-029 bảng đặt tên dòng '-v1'; AC-029-04", summary: "Không AC nào nói thư mục output đã có file thì làm gì: ghi đè, từ chối hay dọn. FR-029 chỉ nói mỗi lần chạy sinh mới toàn bộ. Nếu output còn tech-specs/ của lần chạy trước, thư mục của component cũ còn lại và AC-029-04 ('mỗi thư mục trong tech-specs/ ứng với đúng một component') không đạt." }
