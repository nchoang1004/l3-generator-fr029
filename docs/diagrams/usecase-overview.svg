<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-labelledby="title description">
  <title id="title">L3 Architecture Generator - Use Case Overview</title>
  <desc id="description">Sơ đồ use case tổng quan cho giao diện phân tích kho mã, nhận thư mục cục bộ, file ZIP hoặc liên kết GitHub, khám phá kiến trúc, kiểm tra bằng chứng và xuất kết quả.</desc>

  <defs>
    <style>
      .page { fill: #f8fafc; }
      .boundary { fill: #ffffff; stroke: #334155; stroke-width: 2; }
      .section { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .section-title { font: 600 15px Inter, Segoe UI, Arial, sans-serif; fill: #475569; letter-spacing: .4px; }
      .title { font: 700 28px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 14px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .boundary-title { font: 700 17px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .uc { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; }
      .uc-abstract { fill: #f1f5f9; stroke: #475569; stroke-width: 1.8; stroke-dasharray: 6 4; }
      .uc-input { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.7; }
      .uc-quality { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.7; }
      .uc-optional { fill: #faf5ff; stroke: #9333ea; stroke-width: 1.7; }
      .uc-text { font: 600 14px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .uc-small { font: 600 12px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .stereotype { font: italic 11px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; text-anchor: middle; }
      .actor-line { stroke: #334155; stroke-width: 2; fill: none; }
      .actor-label { font: 600 13px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .association { stroke: #64748b; stroke-width: 1.5; fill: none; }
      .relation { stroke: #475569; stroke-width: 1.4; fill: none; stroke-dasharray: 6 5; }
      .generalization { stroke: #475569; stroke-width: 1.4; fill: none; }
      .relation-label { font: italic 11px Inter, Segoe UI, Arial, sans-serif; fill: #475569; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
      .note { fill: #fffbeb; stroke: #d97706; stroke-width: 1.2; }
      .note-text { font: 12px Inter, Segoe UI, Arial, sans-serif; fill: #78350f; }
      .legend { font: 12px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect class="page" width="1500" height="1040"/>

  <text class="title" x="750" y="38" text-anchor="middle">L3 Architecture Generator — Use Case Overview</text>
  <text class="subtitle" x="750" y="62" text-anchor="middle">Nhập kho mã → phân tích → khám phá kiến trúc → kiểm tra độ tin cậy → xuất và sử dụng kết quả</text>

  <rect class="boundary" x="260" y="80" width="980" height="880" rx="12"/>
  <rect x="285" y="70" width="290" height="24" rx="5" fill="#ffffff"/>
  <text class="boundary-title" x="300" y="88">L3 Architecture Generator</text>

  <rect class="section" x="285" y="110" width="930" height="265" rx="10"/>
  <text class="section-title" x="305" y="135">1. ANALYZE REPOSITORY</text>

  <rect class="section" x="285" y="395" width="930" height="330" rx="10"/>
  <text class="section-title" x="305" y="420">2. EXPLORE ARCHITECTURE</text>

  <rect class="section" x="285" y="745" width="930" height="190" rx="10"/>
  <text class="section-title" x="305" y="770">3. REVIEW &amp; USE RESULTS</text>

  <!-- Analyze repository use cases -->
  <ellipse class="uc" cx="500" cy="205" rx="145" ry="32"/>
  <text class="uc-text" x="500" y="210">UC1 Phân tích kho mã</text>

  <ellipse class="uc-abstract" cx="930" cy="160" rx="120" ry="32"/>
  <text class="stereotype" x="930" y="153">«abstract»</text>
  <text class="uc-text" x="930" y="172">Cung cấp mã nguồn</text>

  <ellipse class="uc-input" cx="800" cy="265" rx="62" ry="29"/>
  <text class="uc-small" x="800" y="262">Chọn thư mục</text>
  <text class="uc-small" x="800" y="277">cục bộ</text>

  <ellipse class="uc-input" cx="935" cy="265" rx="58" ry="29"/>
  <text class="uc-small" x="935" y="262">Tải lên</text>
  <text class="uc-small" x="935" y="277">file ZIP</text>

  <ellipse class="uc-input" cx="1065" cy="265" rx="55" ry="29"/>
  <text class="uc-small" x="1065" y="262">Nhập URL</text>
  <text class="uc-small" x="1065" y="277">GitHub</text>

  <!-- Analyze relationships -->
  <path class="relation" d="M 645 195 C 700 180, 750 168, 808 163" marker-end="url(#arrow)"/>
  <text class="relation-label" x="730" y="166">«include»</text>
  <path class="generalization" d="M 825 238 C 846 210, 867 190, 887 180" marker-end="url(#triangle)"/>
  <path class="generalization" d="M 934 236 C 934 215, 933 199, 932 193" marker-end="url(#triangle)"/>
  <path class="generalization" d="M 1039 239 C 1015 210, 990 190, 973 181" marker-end="url(#triangle)"/>

  <!-- Explore architecture use cases -->
  <ellipse class="uc-abstract" cx="665" cy="455" rx="155" ry="32"/>
  <text class="stereotype" x="665" y="448">«abstract»</text>
  <text class="uc-text" x="665" y="467">UC2 Khám phá kiến trúc</text>

  <ellipse class="uc" cx="405" cy="540" rx="105" ry="31"/>
  <text class="uc-text" x="405" y="545">Xem tổng quan</text>

  <ellipse class="uc" cx="665" cy="540" rx="130" ry="31"/>
  <text class="uc-small" x="665" y="537">Xem ứng dụng</text>
  <text class="uc-small" x="665" y="552">&amp; thành phần</text>

  <ellipse class="uc" cx="945" cy="540" rx="120" ry="31"/>
  <text class="uc-small" x="945" y="537">Xem API</text>
  <text class="uc-small" x="945" y="552">&amp; luồng yêu cầu</text>

  <ellipse class="uc" cx="445" cy="650" rx="135" ry="31"/>
  <text class="uc-small" x="445" y="647">Xem kho dữ liệu</text>
  <text class="uc-small" x="445" y="662">&amp; tích hợp</text>

  <ellipse class="uc" cx="735" cy="650" rx="125" ry="31"/>
  <text class="uc-text" x="735" y="655">Truy vết phụ thuộc</text>

  <ellipse class="uc-quality" cx="1030" cy="650" rx="125" ry="31"/>
  <text class="uc-text" x="1030" y="655">Kiểm tra bằng chứng nguồn</text>

  <!-- Explore relationships -->
  <path class="generalization" d="M 449 513 C 497 490, 540 475, 567 468" marker-end="url(#triangle)"/>
  <path class="generalization" d="M 665 509 L 665 490" marker-end="url(#triangle)"/>
  <path class="generalization" d="M 898 512 C 846 489, 800 475, 765 467" marker-end="url(#triangle)"/>
  <path class="generalization" d="M 480 621 C 520 570, 565 515, 609 482" marker-end="url(#triangle)"/>
  <path class="generalization" d="M 712 620 C 700 575, 690 526, 678 488" marker-end="url(#triangle)"/>
  <path class="relation" d="M 905 650 L 862 650" marker-end="url(#arrow)"/>
  <text class="relation-label" x="883" y="642">«extend»</text>

  <!-- Review and use results -->
  <ellipse class="uc-abstract" cx="650" cy="790" rx="155" ry="29"/>
  <text class="stereotype" x="650" y="784">«abstract»</text>
  <text class="uc-text" x="650" y="800">UC3 Xem xét &amp; sử dụng kết quả</text>

  <ellipse class="uc-quality" cx="505" cy="875" rx="125" ry="30"/>
  <text class="uc-small" x="505" y="880">UC3.1 Xem kết quả chi tiết</text>

  <ellipse class="uc-quality" cx="795" cy="875" rx="120" ry="30"/>
  <text class="uc-small" x="795" y="872">UC3.2 Xuất</text>
  <text class="uc-small" x="795" y="887">tài liệu kiến trúc</text>

  <path class="generalization" d="M 540 847 C 565 828, 590 814, 610 807" marker-end="url(#triangle)"/>
  <path class="generalization" d="M 760 847 C 735 828, 710 814, 690 807" marker-end="url(#triangle)"/>

  <!-- Left-side actors -->
  <g aria-label="Developer actor">
    <circle class="actor-line" cx="90" cy="150" r="17"/>
    <path class="actor-line" d="M 90 167 L 90 215 M 58 185 L 122 185 M 90 215 L 62 249 M 90 215 L 118 249"/>
    <text class="actor-label" x="90" y="272">Developer</text>
  </g>

  <g aria-label="Engineering User abstract actor">
    <circle class="actor-line" cx="170" cy="405" r="17"/>
    <path class="actor-line" d="M 170 422 L 170 470 M 138 440 L 202 440 M 170 470 L 142 504 M 170 470 L 198 504"/>
    <text class="stereotype" x="170" y="525">«abstract»</text>
    <text class="actor-label" x="170" y="543">Engineering User</text>
  </g>

  <g aria-label="Architect or Reviewer actor">
    <circle class="actor-line" cx="90" cy="650" r="17"/>
    <path class="actor-line" d="M 90 667 L 90 715 M 58 685 L 122 685 M 90 715 L 62 749 M 90 715 L 118 749"/>
    <text class="actor-label" x="90" y="772">Architect / Reviewer</text>
  </g>

  <!-- Actor generalization and associations -->
  <path class="generalization" d="M 112 232 C 125 290, 145 340, 163 385" marker-end="url(#triangle)"/>
  <path class="generalization" d="M 112 667 C 130 605, 148 550, 163 506" marker-end="url(#triangle)"/>
  <path class="association" d="M 122 185 C 230 190, 300 198, 355 202"/>
  <path class="association" d="M 202 440 C 310 438, 415 445, 510 452"/>
  <path class="association" d="M 198 470 C 330 610, 465 720, 555 776"/>

  <!-- Right-side actors -->
  <g aria-label="GitHub actor">
    <circle class="actor-line" cx="1380" cy="155" r="17"/>
    <path class="actor-line" d="M 1380 172 L 1380 220 M 1348 190 L 1412 190 M 1380 220 L 1352 254 M 1380 220 L 1408 254"/>
    <text class="actor-label" x="1380" y="277">GitHub</text>
    <text class="stereotype" x="1380" y="294">external system</text>
  </g>

  <path class="association" d="M 1348 190 C 1250 205, 1165 235, 1120 254"/>

  <!-- UI principles learned from RepoDNA, adapted to this product -->
  <path class="note" d="M 1265 575 h 195 v 112 h -195 z M 1442 575 l 18 18 h -18 z"/>
  <text class="note-text" x="1280" y="600">UI tổ chức theo mục tiêu:</text>
  <text class="note-text" x="1280" y="620">• nhìn tổng quan</text>
  <text class="note-text" x="1280" y="640">• đi sâu theo thành phần</text>
  <text class="note-text" x="1280" y="660">• truy vết về source evidence</text>
  <text class="note-text" x="1280" y="680">• luôn thấy giới hạn phân tích</text>

  <line x1="300" y1="990" x2="340" y2="990" class="association"/>
  <text class="legend" x="350" y="994">association</text>
  <line x1="455" y1="990" x2="495" y2="990" class="relation" marker-end="url(#arrow)"/>
  <text class="legend" x="505" y="994">«include» / «extend»</text>
  <line x1="670" y1="990" x2="710" y2="990" class="generalization" marker-end="url(#triangle)"/>
  <text class="legend" x="720" y="994">generalization → phần chung</text>
</svg>
